<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Subtle glow ring -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Elevated Note Card -->
  <g filter="url(#shadow)">
    <rect x="88" y="76" width="336" height="360" rx="36" fill="url(#cardGrad)"/>
  </g>

  <!-- Card Header Tab Accent -->
  <path d="M 170 76 L 342 76 C 342 76, 332 108, 312 108 L 200 108 C 180 108, 170 76, 170 76 Z" fill="#E0E7FF"/>

  <!-- Checklist Item 1 (Completed with Check Badge) -->
  <g transform="translate(124, 142)">
    <!-- Check circle badge -->
    <circle cx="28" cy="28" r="24" fill="url(#checkGrad)" filter="url(#badgeShadow)"/>
    <path d="M 19 28 L 25 34 L 37 21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Task bar lines -->
    <rect x="68" y="14" width="160" height="14" rx="7" fill="#6366F1"/>
    <rect x="68" y="34" width="96" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- Checklist Item 2 (Active item) -->
  <g transform="translate(124, 224)">
    <!-- Unchecked rounded box -->
    <rect x="4" y="4" width="48" height="48" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Task bar lines -->
    <rect x="68" y="14" width="176" height="14" rx="7" fill="#334155"/>
    <rect x="68" y="34" width="112" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- Checklist Item 3 (Upcoming Buy / Heart item) -->
  <g transform="translate(124, 306)">
    <!-- Orange / Coral Buy tag badge -->
    <rect x="4" y="4" width="48" height="48" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
    <text x="28" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#D97706">₹</text>

    <!-- Task bar lines -->
    <rect x="68" y="14" width="144" height="14" rx="7" fill="#475569"/>
    <rect x="68" y="34" width="80" height="10" rx="5" fill="#F59E0B"/>
  </g>

  <!-- Brand Label Badge at Bottom of Card -->
  <rect x="180" y="386" width="152" height="32" rx="16" fill="#EDE9FE"/>
  <text x="256" y="408" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6D28D9" letter-spacing="2.5">LIST DO</text>
</svg>
